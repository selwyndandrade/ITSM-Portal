name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_TestPassword!23"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci_TestPassword!23 -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI_CONNECTION_STRING: "Server=localhost,1433;Database=ITSMDatabase_CI;User Id=sa;Password=Ci_TestPassword!23;TrustServerCertificate=True"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ITSM-Portal.slnx

      - name: Build
        run: dotnet build ITSM.Portal.API/ITSM.Portal.API.csproj --no-restore --configuration Release

      - name: Run unit/integration tests
        run: dotnet test ITSM.Portal.API.Tests/ITSM.Portal.API.Tests.csproj --no-restore --configuration Release

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Check for model changes missing a migration
        working-directory: ITSM.Portal.API
        run: dotnet ef migrations has-pending-model-changes

      - name: Verify migrations apply cleanly to a fresh database
        working-directory: ITSM.Portal.API
        run: dotnet ef database update --connection "${{ env.CI_CONNECTION_STRING }}"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: itsm-portal-client/package-lock.json

      - name: Install dependencies
        working-directory: itsm-portal-client
        run: npm ci

      - name: Build
        working-directory: itsm-portal-client
        run: npm run build
